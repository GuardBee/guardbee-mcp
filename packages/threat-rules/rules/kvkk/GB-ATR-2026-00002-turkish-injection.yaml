title: "Turkish-language prompt injection / instruction override"
id: GB-ATR-2026-00002
rule_version: 1
status: experimental
description: >
  Detects common Turkish instruction-override phrases aimed at an AI agent
  (önceki talimatları yoksay, sistem promptunu göster, geliştirici modu, vb.).
author: GuardBee
date: 2026/10/06
schema_version: "0.1"
detection_tier: pattern
maturity: test
severity: high

references:
  owasp_llm:
    - "LLM01:2025"
  owasp_agentic:
    - "ASI01:2026"

tags:
  category: prompt-injection
  subcategory: turkish-direct
  scan_target: mcp
  confidence: high

agent_source:
  type: llm_io
  framework:
    - any

detection:
  conditions:
    - field: user_input
      operator: regex
      value: "(?i)(önceki|onceki|tüm|tum|bütün|butun)\\s+(talimat|komut|kural|yönerge|yonerge|instruction)(ları|lari|larımı|larimi)?\\s*(yoksay|görmezden\\s*gel|gorme[zs]den\\s*gel|unut|iptal\\s*et|yok\\s*say)"
      description: "Turkish: ignore previous instructions"
    - field: user_input
      operator: regex
      value: "(?i)(sistem\\s*prompt(u|unu)?|system\\s*prompt)\\s*(nu\\s*)?(göster|goster|yazdır|yazdir|açığa\\s*çıkar|aciga\\s*cikar|paylaş|paylas|sızdır|sizdir)"
      description: "Turkish: reveal system prompt"
    - field: user_input
      operator: regex
      value: "(?i)(geliştirici|gelistirici|developer)\\s*modu?(na)?\\s*(geç|gec|aktif|aç|ac|ol)"
      description: "Turkish: enter developer mode"
    - field: user_input
      operator: regex
      value: "(?i)(rolünü|rolunu|kimliğini|kimligini)\\s*(unut|değiştir|degistir|bırak|birak).{0,40}(artık|artik|şimdi|simdi)"
      description: "Turkish: abandon your role"
    - field: content
      operator: regex
      value: "(?i)(önceki\\s+talimatları\\s+yoksay|sistem\\s+promptunu\\s+göster|geliştirici\\s+moduna\\s+geç)"
      description: "Turkish shorthand injection phrases on raw content"
  condition: any
  false_positives:
    - "Documentation explaining Turkish injection phrases without directing the model"

response:
  actions:
    - alert
    - escalate
  message_template: |
    [GB-ATR-2026-00002] Turkish prompt-injection phrasing detected.
    Follow up with @guardbee/mcp-prompt-injection-scanner.
