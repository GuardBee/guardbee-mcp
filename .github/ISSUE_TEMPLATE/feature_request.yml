name: Feature request
description: A check, an integration or an option you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to protect against or automate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: input
    id: package
    attributes:
      label: Package (if any)
