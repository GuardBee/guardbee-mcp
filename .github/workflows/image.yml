# The gateway as a container image: ghcr.io/guardbee/mcp-security-proxy, multi-arch
# (amd64, arm64), with an SBOM and SLSA provenance attestation, signed with cosign
# (keyless, this workflow's identity). Built after each Release run that published a
# new proxy version to npm, or by hand for a given version.
#
# Verify:  cosign verify ghcr.io/guardbee/mcp-security-proxy:1 \
#            --certificate-identity-regexp '^https://github.com/GuardBee/guardbee-mcp/' \
#            --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "@guardbee/mcp-security-proxy version to build (empty: the latest on npm)"
        required: false

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/guardbee/mcp-security-proxy

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version to build
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(npm view @guardbee/mcp-security-proxy version)}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "not a version: $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          # A Release run that published no new proxy version has nothing to build
          if [ -z "$REQUESTED" ] && docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$version already exists"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.version.outputs.skip != 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.version.outputs.skip != 'true'

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub too, when the organization has set the credentials
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        id: dockerhub
        if: steps.version.outputs.skip != 'true' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
          DOCKERHUB: ${{ steps.dockerhub.outcome == 'success' && 'guardbee/mcp-security-proxy' || '' }}
        run: |
          tags="$IMAGE:$VERSION,$IMAGE:$MAJOR,$IMAGE:latest"
          if [ -n "$DOCKERHUB" ]; then tags="$tags,$DOCKERHUB:$VERSION,$DOCKERHUB:$MAJOR,$DOCKERHUB:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.version.outputs.skip != 'true'
        with:
          context: packages/security-proxy
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          sbom: true
          provenance: mode=max

      - name: Smoke test
        if: steps.version.outputs.skip != 'true'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: docker run --rm --entrypoint guardbee-proxy "$REF" --version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.version.outputs.skip != 'true'

      - name: Sign
        if: steps.version.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ steps.dockerhub.outcome == 'success' && 'guardbee/mcp-security-proxy' || '' }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          if [ -n "$DOCKERHUB" ]; then cosign sign --yes "docker.io/$DOCKERHUB@$DIGEST"; fi
