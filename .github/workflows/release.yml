name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # A classic NPM_TOKEN with "Authorization and Publishing" 2FA only reaches
      # staging (E_STAGE_REQUIRED). Clear it so publish can use GitHub OIDC.
      - name: Prefer npm trusted publishing (OIDC)
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # Install/build stay on workspace pnpm 10; publish needs pnpm >= 11.0.7 for OIDC.
      - uses: changesets/action@v1
        with:
          publish: bash -lc 'corepack enable && corepack prepare pnpm@11.1.3 --activate && pnpm release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not set NODE_AUTH_TOKEN / NPM_TOKEN — that forces the staging-only
          # classic token path and blocks trusted publishing.
