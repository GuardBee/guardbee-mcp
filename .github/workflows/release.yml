name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write   # start CI for the Version Packages PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # setup-node writes //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
      # A classic NPM_TOKEN with "Authorization and Publishing" 2FA only reaches
      # staging (E_STAGE_REQUIRED). Clear it so publish can use GitHub OIDC.
      - name: Prefer npm trusted publishing (OIDC)
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # Install/build stay on workspace pnpm 10; publish needs pnpm >= 11.0.7 for OIDC.
      # Corepack resolves `pnpm` to the root packageManager version (10.11.0), and
      # pnpm 11 itself switches back to that version unless pm-on-fail=ignore
      # (pnpm 11 no longer reads package-manager-strict from .npmrc). Install the
      # real pnpm 11 binary, put it first on PATH, and fail if it is not 11.
      - name: Switch to pnpm 11 for OIDC publish
        run: |
          corepack disable
          npm install -g pnpm@11.1.3
          bin="$(npm prefix -g)/bin"
          echo "$bin" >> "$GITHUB_PATH"
          echo "pnpm_config_pm_on_fail=ignore" >> "$GITHUB_ENV"
          v="$(pnpm_config_pm_on_fail=ignore "$bin/pnpm" --version)"
          echo "pnpm $v"
          test "$v" = "11.1.3"

      # Not `pnpm release`: under pnpm 11 a `pnpm run` first re-installs node_modules
      # (verify-deps-before-run) and that install fails on unapproved build scripts.
      # The build already ran above with pnpm 10; changeset publish then calls the
      # pnpm 11 on PATH for each `pnpm publish`.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          # v2 renamed these inputs (version/publish); with the old names the step fails
          version-script: node scripts/version.mjs
          publish-script: npx changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The "GitHub releases" step below owns releases
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pnpm_config_verify_deps_before_run: "false"
          # Do not set NODE_AUTH_TOKEN / NPM_TOKEN — that forces the staging-only
          # classic token path and blocks trusted publishing.

      # A PR opened with GITHUB_TOKEN triggers no workflows, so the Version Packages PR
      # would have no CI (and branch protection would wait for it): start CI on its branch.
      - name: CI for the Version Packages PR
        if: steps.changesets.outputs.pr-number != ''
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action finds new versions by reading the changeset CLI's output, which
      # changed in changeset v3, so it made no releases. This creates the tag and GitHub
      # release for every package version that is on npm and has none yet (idempotent,
      # like the registry step below).
      - name: GitHub releases
        run: node scripts/github-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bring the official MCP Registry up to npm (scripts/publish-registry.mjs
      # works from registry/npm state, not changesets' output, so a skipped run
      # is caught up by the next). GitHub OIDC proves this repo, so names live
      # under io.github.GuardBee/*.
      - name: Publish to the MCP Registry
        run: |
          # Pinned by hash (from the release's registry_1.8.1_checksums.txt)
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          node scripts/publish-registry.mjs
