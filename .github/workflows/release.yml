name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Node 22's bundled npm predates OIDC Trusted Publishing support (needs >=11.5.0).
      # Without this, npm falls back to NODE_AUTH_TOKEN below, which this account's
      # 2FA "Authorization and Publishing" policy restricts to a staging-only publish
      # (E_STAGE_REQUIRED) -- the actual recurring cause of this workflow failing.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback for any package that doesn't have a Trusted Publisher configured
          # yet on npmjs.com (Package Settings -> Publishing Access -> Trusted
          # Publisher -> GitHub Actions -> this repo + this workflow file). Once a
          # package has that configured, npm's OIDC flow is used automatically and
          # this token is not needed for it -- npm prefers OIDC over a present token
          # when the CI context matches a configured trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
