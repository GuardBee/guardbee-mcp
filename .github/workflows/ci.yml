name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts it for the Version Packages PR: a PR its GITHUB_TOKEN
  # opens or updates triggers no pull_request run.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run test
      - name: server.json matches package.json
        run: node scripts/sync-server-json.mjs --check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint and render the gateway chart
        run: |
          helm lint charts/guardbee-gateway --strict --set-file config=examples/proxy/kubernetes.yaml
          helm template t charts/guardbee-gateway --set-file config=examples/proxy/kubernetes.yaml \
            --set secret.values.GUARDBEE_PROXY_KEY=x --set ingress.enabled=true --set autoscaling.enabled=true --set podDisruptionBudget.enabled=true > /dev/null
          # Without a config the chart must refuse, not deploy a gateway that cannot start
          ! helm template t charts/guardbee-gateway > /dev/null 2>&1
