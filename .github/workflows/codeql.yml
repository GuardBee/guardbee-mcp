# CodeQL: GitHub's static analysis for the TypeScript/JavaScript in every package.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "31 3 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          # Test fixtures hold deliberately vulnerable code for the scanners to find
          config: |
            paths-ignore:
              - "**/__tests__/**"
              - "**/fixtures/**"
              - "examples/**"

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
