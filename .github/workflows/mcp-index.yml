# GuardBee MCP Index: grade every server in the official MCP Registry once a week
# and publish the result (index/v1.json, badges, the search page, the rubric) to
# GitHub Pages. Needs Pages enabled with "GitHub Actions" as the source.
name: MCP Index

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Grade only the first N servers (empty: all)"
        required: false

permissions:
  contents: read

concurrency:
  group: mcp-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@guardbee/mcp-index...

      - name: Grade the registry
        env:
          LIMIT: ${{ inputs.limit }}
        run: node packages/mcp-index/dist/cli.js crawl --out site --concurrency 8 ${LIMIT:+--limit "$LIMIT"}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
