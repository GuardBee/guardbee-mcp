{{- if and (not .Values.secret.existingSecret) .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guardbee-gateway.fullname" . }}
  labels: {{- include "guardbee-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
